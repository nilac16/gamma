[build-system]
requires = ["setuptools", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma"
version = "1.0"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["gamma"]

[[tool.setuptools.ext-modules]]
name = "cgamma"
sources = [
    "gamma/module.c",
    "gamma/gamma.c",
    "gamma/psearch.c",
    "gamma/distribution.c",
    "gamma/mat.c",
]
